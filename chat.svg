<svg width="550" height="350" viewBox="0 0 550 350" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Light Mode Gradient -->
    <linearGradient id="gray-grad-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ececee"/>
      <stop offset="100%" stop-color="#e2e2e7"/>
    </linearGradient>

    <!-- Dark Mode Gradient -->
    <linearGradient id="gray-grad-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="bubble-depth" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .bubble {
      fill: url(#gray-grad-light);
      filter: url(#bubble-depth);
    }

    text {
      fill: #000000;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
    }

    a {
      fill: #007aff;
      text-decoration: underline;
    }

    .emoji {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
    }

    .typing-dot {
      fill: #8e8e93;
    }

    .typing-1 {
      opacity: 0;
      animation: fade-in-out 1.5s;
    }

    .msg-1 {
      animation: wait 1.7s, msg-1 0.2s 1.7s;
    }

    .typing-2 {
      opacity: 0;
      animation: wait 2.5s, fade-in-out 1.5s 2.5s;
    }

    .msg-2 {
      animation: wait 4.2s, msg-2 0.2s 4.2s;
    }

    .typing-3 {
      opacity: 0;
      animation: wait 5s, fade-in-out 1.5s 5s;
    }

    .msg-3 {
      animation: wait 6.7s, msg-3 0.2s 6.7s;
    }

    .typing-4 {
      opacity: 0;
      animation: wait 7.5s, fade-in-out 1.5s 7.5s;
    }

    .msg-4 {
      animation: wait 9.2s, msg-4 0.2s 9.2s;
    }

    .typing-5 {
      opacity: 0;
      animation: wait 10s, fade-in-out 1.5s 10s;
    }

    .msg-5 {
      animation: wait 11.7s, msg-5 0.2s 11.7s;
    }

    .typing-6 {
      opacity: 0;
      animation: wait 12.5s, fade-in-out 1.5s 12.5s;
    }

    .msg-6 {
      animation: wait 14.2s, msg-6 0.2s 14.2s;
    }

    @keyframes wait {
      0%,
      100% {
        opacity: 0;
      }
    }

    @keyframes fade-in-out {
      0%,
      100% {
        opacity: 0;
      }
      25%,
      90% {
        opacity: 1;
      }
    }

    @keyframes msg-1 {
      0% {
        opacity: 0;
        transform: translate(16px, 5px);
      }
      100% {
        opacity: 1;
        transform: translate(16px, 0);
      }
    }

    @keyframes msg-2 {
      0% {
        opacity: 0;
        transform: translate(16px, 51px);
      }
      100% {
        opacity: 1;
        transform: translate(16px, 46px);
      }
    }

    @keyframes msg-3 {
      0% {
        opacity: 0;
        transform: translate(16px, 121px);
      }
      100% {
        opacity: 1;
        transform: translate(16px, 116px);
      }
    }

    @keyframes msg-4 {
      0% {
        opacity: 0;
        transform: translate(16px, 191px);
      }
      100% {
        opacity: 1;
        transform: translate(16px, 186px);
      }
    }

    @keyframes msg-5 {
      0% {
        opacity: 0;
        transform: translate(16px, 237px);
      }
      100% {
        opacity: 1;
        transform: translate(16px, 232px);
      }
    }

    @keyframes msg-6 {
      0% {
        opacity: 0;
        transform: translate(16px, 283px);
      }
      100% {
        opacity: 1;
        transform: translate(16px, 278px);
      }
    }

    @media (prefers-color-scheme: dark) {
      .bubble {
        fill: url(#gray-grad-dark);
      }
      text {
        fill: #f2f2f7;
      }
      a {
        fill: #0a84ff;
      }
      .typing-dot {
        fill: #98989d;
      }
    }
  </style>

  <!-- typing 1 -->
  <g transform="translate(16, 0)" class="typing-1">
    <rect width="70" height="40" rx="18" class="bubble" />
    <path d="M 0,22 C -3,25 -7,32 -7,40 C -3,40 6,40 18,40 A 18,18 0 0,1 0,22 Z" class="bubble" />
    <circle cx="23" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="47" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Hi, I'm Amar -->
  <g transform="translate(16, 0)" class="msg-1">
    <rect width="130" height="40" rx="18" class="bubble" />
    <text x="16" y="25">Hi, I'm Amar</text>
  </g>

  <!-- typing 2 -->
  <g transform="translate(16, 46)" class="typing-2">
    <rect width="70" height="40" rx="18" class="bubble" />
    <path d="M 0,22 C -3,25 -7,32 -7,40 C -3,40 6,40 18,40 A 18,18 0 0,1 0,22 Z" class="bubble" />
    <circle cx="23" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="47" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- From India... -->
  <g transform="translate(16, 46)" class="msg-2">
    <rect width="385" height="64" rx="18" class="bubble" />
    <text x="16" y="25">I live in Pune, India where it’s supposed to be</text>
    <text x="16" y="48">87° F (31° C) and <tspan class="emoji">☁️</tspan> today.</text>
  </g>

  <!-- typing 3 -->
  <g transform="translate(16, 116)" class="typing-3">
    <rect width="70" height="40" rx="18" class="bubble" />
    <path d="M 0,22 C -3,25 -7,32 -7,40 C -3,40 6,40 18,40 A 18,18 0 0,1 0,22 Z" class="bubble" />
    <circle cx="23" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="47" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Work ... -->
  <g transform="translate(16, 116)" class="msg-3">
    <rect width="490" height="64" rx="18" class="bubble" />
    <text x="16" y="25">I’m a data engineer. I spent 4 years at sahaj.ai,</text>
    <text x="16" y="48">and now I’ve joined Citi to work on large-scale systems.</text>
  </g>

  <!-- typing 4 -->
  <g transform="translate(16, 186)" class="typing-4">
    <rect width="70" height="40" rx="18" class="bubble" />
    <path d="M 0,22 C -3,25 -7,32 -7,40 C -3,40 6,40 18,40 A 18,18 0 0,1 0,22 Z" class="bubble" />
    <circle cx="23" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="47" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Twitter / Link -->
  <g transform="translate(16, 186)" class="msg-4">
    <rect width="275" height="40" rx="18" class="bubble" />
    <text x="16" y="25">
      You can find more about me
      <a href="https://amarpandey.me/" xlink:href="https://amarpandey.me/">here</a>
    </text>
  </g>

  <!-- typing 5 -->
  <g transform="translate(16, 232)" class="typing-5">
    <rect width="70" height="40" rx="18" class="bubble" />
    <path d="M 0,22 C -3,25 -7,32 -7,40 C -3,40 6,40 18,40 A 18,18 0 0,1 0,22 Z" class="bubble" />
    <circle cx="23" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="47" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Thanks -->
  <g transform="translate(16, 232)" class="msg-5">
    <rect width="205" height="40" rx="18" class="bubble" />
    <text x="16" y="25">Thanks for stopping by</text>
  </g>

  <!-- typing 6 -->
  <g transform="translate(16, 278)" class="typing-6">
    <rect width="70" height="40" rx="18" class="bubble" />
    <path d="M 0,22 C -3,25 -7,32 -7,40 C -3,40 6,40 18,40 A 18,18 0 0,1 0,22 Z" class="bubble" />
    <circle cx="23" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="47" cy="20" r="4.5" class="typing-dot">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Have a great... -->
  <g transform="translate(16, 278)" class="msg-6">
    <rect width="220" height="40" rx="18" class="bubble" />
    <path d="M 0,22 C -3,25 -7,32 -7,40 C -3,40 6,40 18,40 A 18,18 0 0,1 0,22 Z" class="bubble" />
    <text x="16" y="25">Have a great Friday! <tspan class="emoji">👋</tspan></text>
  </g>
</svg>
